spring:
  main:
    web-application-type: none

app:
  cli:
    enabled: false
  timezone: Europe/Moscow
  gigachat:
    auth-key: ${GIGACHAT_AUTH_KEY:}
    scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
    model: ${GIGACHAT_MODEL:GigaChat-2-Max}
  singularity:
    api-token: ${SINGULARITY_API_TOKEN:}
    base-url: ${SINGULARITY_API_BASE_URL:https://api.singularity-app.com}
  alice:
    allowed-user-ids: ${ALICE_ALLOWED_USER_IDS:}
    greeting: Поставьте Диме новую задачу


logging:
  level:
    root: WARN
    dev.alice.singularity: INFO
